use_zupt=true
use_nhc=true
zupt_speed_threshold=0.05
zupt_velocity_std=0.02
nhc_lateral_std=1.0
nhc_vertical_std=0.3
nhc_max_lateral_residual=0.8
nhc_max_vertical_residual=1.0
nhc_min_speed=1.0
